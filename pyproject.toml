[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-adviser"
version = "0.1.0"
description = "A modular Python base library for market data, indicators, candles, and sentiment analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Investment Adviser Contributors" }
]
dependencies = [
    "mt5linux",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["investment_adviser*"]

[tool.setuptools.package-data]
investment_adviser = ["providers/data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
