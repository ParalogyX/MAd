services:
  mad-signals:
    build:
      context: .
    image: mad-signals:latest
    container_name: mad-signals
    restart: on-failure
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      M_AD_OUTPUT_DIR: /data
      MT5_HOST: ${MT5_HOST:-127.0.0.1}
      MT5_PORT: ${MT5_PORT:-8001}
    volumes:
      - ${M_AD_DATA_DIR:-./runtime}:/data
    stdin_open: true
    tty: true
